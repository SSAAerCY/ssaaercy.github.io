- id: icebear
  title: "ICEBEAR"
  expanded_name: "Investigating Chemical Evolution Between icE and gAs in massive protostaRs"
  pi: "Yuan Chen"
  program_ids: "JWST GO 8887 (Cycle 4) · ALMA 2025.1.01411.S (Cycle 12)"
  overview: "/research/icebear/"
  description: |-
    ICEBEAR is a JWST program that I lead as principal investigator (PI). We will compare complex organic molecules in the ice and gas of 15 high-mass protostars selected from existing ALMA surveys. These sources have rich gas-phase molecular spectra and are suitable for JWST's mid-infrared spectroscopy. Most ice–gas comparisons to date have focused on low- and intermediate-mass protostars. This sample will let us examine how the chemistry changes in the environments around forming massive stars.

    We will use JWST/MIRI-MRS to measure the weak absorption features of complex organic ices and compare their abundances with the ALMA gas measurements. Molecules stored in icy grain mantles enter the gas as the dust warms, but their relative abundances may change through subsequent reactions. The ice and gas measurements will let us examine which molecules retain similar abundances relative to $\mathdefault{CH\_{3}OH}$ and where additional chemistry may be needed to explain the differences. Because the two telescopes sample different regions, the observing geometry also needs to be accounted for in this comparison.

    The ALMA Cycle 12 follow-up program, 2025.1.01411.S, will measure simpler molecules such as $\mathdefault{H\_{2}CO}$, $\mathdefault{HNCO}$, and $\mathdefault{HCOOH}$. These observations will extend the gas–ice comparison to $\mathdefault{H\_{2}CO}$ and $\mathdefault{HCOOH}$ and examine the chemical links between the ice ions $\mathdefault{OCN^{-}}$ and $\mathdefault{HCOO^{-}}$ and their neutral gas relatives. We will also compare JWST rovibrational spectra with ALMA rotational lines of $\mathdefault{SO\_{2}}$, $\mathdefault{SiO}$, $\mathdefault{CS}$, and $\mathdefault{HCN}$ to test how much infrared radiation, alongside collisions, contributes to their excitation.

    The full mid-infrared spectra will also let us measure abundant ice species such as $\mathdefault{H\_{2}O}$ and $\mathdefault{CO\_{2}}$ and look for signs of thermal processing in their bands. Molecular and atomic emission lines can trace warm gas, shocks, and ionization, while silicate features and the dust continuum constrain extinction and dust properties. Mapping the line emission and comparing it with simultaneous MIRI imaging may help distinguish material close to the protostars from that along nearby jets and outflow cavities. We can then examine how these local conditions affect the gas and ice chemistry.

- id: joys
  title: "JOYS"
  expanded_name: "JWST Observations of Young protoStars"
  pi: "Ewine F. van Dishoeck"
  program_ids: "JWST GTO 1290"
  overview: "/research/joys/"
  description: |-
    JOYS is a collaborative JWST program studying young stars and their surroundings, including accretion, jets, outflows, embedded disks, and the chemistry of gas and ice. My work in JOYS and its JOYS+ ice studies focuses on organic molecules and ions in protostellar ices. JWST's sensitivity and spectral resolution allow us to measure weak, overlapping absorption features that were difficult to identify and quantify with earlier infrared telescopes.

    I compare JWST/MIRI-MRS spectra with laboratory ice measurements to identify the molecules contributing to these bands and examine how their strengths and profiles vary across sources. Spectra from JOYS, JOYS+, and the IPA program let me assess how widespread the weak bands are and whether they have common carriers. In individual protostars, I also compare the ice abundances with gas measurements from ALMA to study how the composition changes after sublimation.

- id: coccoa
  title: "CoCCoA"
  expanded_name: "Complex Chemistry in hot Cores with ALMA"
  pi: "Brett McGuire"
  program_ids: "ALMA 2019.1.00246.S, 2019.2.00112.S, 2022.1.00499.S, 2023.1.00466.S"
  overview: "/research/coccoa/"
  description: |-
    CoCCoA is an ALMA survey of hot cores, the warm molecular regions around forming massive stars. Their spectra contain many organic molecules whose formation histories are still uncertain. I compare the molecular abundances across high-mass sources and with those in low-mass protostars to examine whether they formed under similar conditions before star formation and how later chemistry may have altered their abundances.

    My work focuses on oxygen-bearing complex organic molecules, including $\mathdefault{CH\_{3}CHO}$, $\mathdefault{C\_{2}H\_{5}OH}$, $\mathdefault{CH\_{3}OCH\_{3}}$, $\mathdefault{CH\_{3}OCHO}$, $\mathdefault{CH\_{2}OHCHO}$, $\mathdefault{(CH\_{2}OH)\_{2}}$, and $\mathdefault{CH\_{3}COCH\_{3}}$. I fit their emission lines to derive column densities and abundance ratios, then compare the measurements with chemical simulations and laboratory experiments. These comparisons test proposed formation and destruction pathways and show where the models still fail to reproduce the observed abundances.
