# Edit personal information here; page content lives in _pages/.
locale: en-US
site_theme: default
title: Yuan Chen
title_separator: "|"
name: Yuan Chen
description: "Yuan Chen (陈缘), astronomer and postdoctoral researcher at MPE, studying astrochemistry, star formation, and interstellar ices with JWST and ALMA."
url: "https://ssaaercy.github.io"
baseurl: ""
repository: "ssaaercy/ssaaercy.github.io"
timezone: Europe/Berlin
author:
  avatar: "profile-undergraduate.jpeg"
  avatar_crop: true
  avatar_crop_preset: undergrad
  name: "Yuan Chen"
  name_zh: "陈缘"
  bio: "Postdoctoral researcher in astrochemistry"
  location: "Garching, Germany"
  employer: "MPE · Center for Astrochemical Studies"
  email: "yuanchen@mpe.mpg.de"
  googlescholar: "https://scholar.google.com/citations?user=CXdR2yMAAAAJ"
  github: "ssaaercy"
  github_sidebar: false
  orcid: "https://orcid.org/0000-0002-3395-5634"
cv_pdf: "/files/Yuan_Chen_CV.pdf"
thesis_pdf: "/files/Yuan_Chen_PhD_thesis.pdf"
breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true
include:
  - _pages
  - files
exclude:
  - README.md
  - UPSTREAM.md
  - AGENTS.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - _docs
  - _bibliography
  - scripts
  - preview.command
  - update-preview.command
  - publish.command
  - node_modules
  - vendor
  - .venv
  # Gallery is kept locally while it is being prepared for publication.
  - _pages/gallery.html
  - _data/gallery.yml
  - images/gallery
  - assets/js/gallery.js
  # Unused portrait alternatives are retained only on this computer.
  - images/profile-original.jpeg
  - images/profile-phd-outdoor.jpeg
  - images/profile.svg
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
encoding: utf-8
markdown: kramdown
highlighter: rouge
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /research/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
